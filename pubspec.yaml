name: centavinhos
description: "Centavinhos · Finanças descomplicadas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.2
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  material_ui: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.1

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/pdf/
    - assets/fonts/

  fonts:
    - family: Libron
      fonts:
        - asset: assets/fonts/Libron-Regular.ttf
        - asset: assets/fonts/Libron-Italic.ttf
          style: italic
        - asset: assets/fonts/Libron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Libron-BoldItalic.ttf
          weight: 700
          style: italic
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-Regular.ttf
        - asset: assets/fonts/RobotoFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoFlex-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoFlex-Bold.ttf
          weight: 700
